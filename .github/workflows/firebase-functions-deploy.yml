name: Deploy adminApi Function

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DEPLOY para confirmar el despliegue de adminApi"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: admin-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy adminApi
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: admin-api-production
    env:
      PROJECT_ID: plcocina-apps
      REGION: us-central1
      FUNCTION_NAME: adminApi
      RUN_SERVICE: adminapi
      ARTIFACT_REPOSITORY: gcf-artifacts
      RUNTIME_SERVICE_ACCOUNT: portal-admin-api@plcocina-apps.iam.gserviceaccount.com
      HOSTING_DEPLOY_SERVICE_ACCOUNT: github-firebase-deploy@plcocina-apps.iam.gserviceaccount.com
      FUNCTIONS_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FUNCTIONS_DEPLOY_SERVICE_ACCOUNT }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment identity configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FUNCTIONS_DEPLOY_SERVICE_ACCOUNT"
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test "$FUNCTIONS_DEPLOY_SERVICE_ACCOUNT" != "$HOSTING_DEPLOY_SERVICE_ACCOUNT"
          test "$FUNCTIONS_DEPLOY_SERVICE_ACCOUNT" != "$RUNTIME_SERVICE_ACCOUNT"
          case "$FUNCTIONS_DEPLOY_SERVICE_ACCOUNT" in
            *@"$PROJECT_ID".iam.gserviceaccount.com) ;;
            *) echo "La identidad de despliegue no pertenece a $PROJECT_ID" >&2; exit 1 ;;
          esac

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install backend dependencies
        run: npm --prefix functions ci

      - name: Build backend
        run: npm run functions:build

      - name: Validate generated Functions manifest
        run: node scripts/validate-admin-api-manifest.mjs

      - name: Run unit and static tests
        run: |
          npm run functions:test
          npm run check

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0

      - name: Run Firestore rules tests in Emulator Suite
        run: npm run functions:test:emulator

      - name: Authenticate with the dedicated deployment identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.FUNCTIONS_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify federated Application Default Credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth application-default print-access-token >/dev/null
          echo "Federated Application Default Credentials are available"

      - name: Verify Firebase CLI can consume ADC
        run: firebase functions:list --project "$PROJECT_ID" --json >/dev/null

      - name: Preflight effective adminApi state
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          fetch_google_json() {
            gcloud auth application-default print-access-token | \
              node scripts/validate-admin-api-deployment.mjs fetch-google-json "$1" "$2"
          }
          fetch_google_json \
            "https://cloudfunctions.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/functions/$FUNCTION_NAME" \
            "$check_dir/function.json"
          fetch_google_json \
            "https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/services/$RUN_SERVICE" \
            "$check_dir/run.json"
          fetch_google_json \
            "https://artifactregistry.googleapis.com/v1/projects/$PROJECT_ID/locations/$REGION/repositories/$ARTIFACT_REPOSITORY" \
            "$check_dir/artifact.json"
          node scripts/validate-admin-api-deployment.mjs cloud-state \
            "$check_dir/function.json" \
            "$check_dir/run.json" \
            "$check_dir/artifact.json"
          node scripts/validate-admin-api-deployment.mjs anonymous-health \
            "$check_dir/function.json"

      - name: Deploy only the admin-api codebase
        run: firebase deploy --only functions:admin-api --project "$PROJECT_ID" --non-interactive

      - name: Postflight effective adminApi state
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          fetch_google_json() {
            gcloud auth application-default print-access-token | \
              node scripts/validate-admin-api-deployment.mjs fetch-google-json "$1" "$2"
          }
          fetch_google_json \
            "https://cloudfunctions.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/functions/$FUNCTION_NAME" \
            "$check_dir/function.json"
          fetch_google_json \
            "https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/services/$RUN_SERVICE" \
            "$check_dir/run.json"
          fetch_google_json \
            "https://artifactregistry.googleapis.com/v1/projects/$PROJECT_ID/locations/$REGION/repositories/$ARTIFACT_REPOSITORY" \
            "$check_dir/artifact.json"
          node scripts/validate-admin-api-deployment.mjs cloud-state \
            "$check_dir/function.json" \
            "$check_dir/run.json" \
            "$check_dir/artifact.json"
          node scripts/validate-admin-api-deployment.mjs anonymous-health \
            "$check_dir/function.json"
