name: Deploy APPS PL COCINA Portal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DEPLOY para confirmar el despliegue de Hosting"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portal Hosting
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: hosting-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/465339579029/locations/global/workloadIdentityPools/github-plcocina/providers/github-actions
          service_account: github-firebase-deploy@plcocina-apps.iam.gserviceaccount.com
          project_id: plcocina-apps
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify Google Cloud credentials
        uses: google-github-actions/setup-gcloud@v3

      - name: Check federated credentials
        run: |
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth application-default print-access-token >/dev/null
          echo "Federated Google Cloud credentials are available"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.1

      - name: Deploy only portal site
        run: firebase deploy --only hosting:portal --project plcocina-apps --non-interactive --debug
